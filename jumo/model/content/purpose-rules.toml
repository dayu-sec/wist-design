# 用途推断规则表 —— 策展数据（对应模型 Control.Agent.Purpose.PurposeRuleSet）
#
# 按平台分册：macOS 一册、Linux 一册（两个平台的判据完全不同；一台机器只用自己平台那册）。
# 规则表是“策展知识”，与采集目录同类：改规则 = 改“怎么判用途”，要走审定；不放进 agentd。
#
# 匹配语义（网关侧实现）：
#   kind = process | process_path | listen_port | package | unit
#   pattern 在该类信号上做**大小写不敏感子串**匹配；命中即给 machine_class 加 weight
# 计分：
#   各机器类别累加 weight → 取最高分 s1、次高 s2
#   confidence = 100 × (s1 − s2) / s1，若 s1 < weak_score 再乘 0.5（信号太弱，不冒充有把握）
#   **无任何命中**时才用 baseline_class（置信度低）；没有 baseline 的平台不产出建议（宁可不猜）
#
# 权重口径：强特征 40（几乎决定性，如 postgres / nvidia-persistenced）
#           中特征 30、弱特征 10~25
#           日常类特征（Safari/Mail）在开发机上同样存在，只给弱权重

[[rule_set]]
rule_set_id = "macos-v1"
platform = "macos"
baseline_class = "MacDaily"
weak_score = 20
published_at = "2026-09-22T00:00:00Z"

# ── macOS：开发机特征 ──────────────────────────────────────────────
[[rule_set.rules]]
rule_id = "mac-dev-xcodebuild"
kind = "process"
pattern = "xcodebuild"
machine_class = "MacDev"
weight = 40

[[rule_set.rules]]
rule_id = "mac-dev-xcode-app"
kind = "process_path"
pattern = "/Applications/Xcode.app"
machine_class = "MacDev"
weight = 30

[[rule_set.rules]]
