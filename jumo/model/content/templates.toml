# 常驻工作模板 —— 内容数据（对应模型 Control.Agent.Content.WorkTemplate）
#
# base_template_id 空 = 独立模板；非空 = 本模板 = 基线模板的全部单元 + 自己的 unit_refs。
# capability_scope / required_privileges 只写本模板自己的单元（基线部分由 base 带）；
# 展开后的有效能力面与权限 = 基线 ∪ 自身。
#
# 状态：4 个模板现在都是 draft —— 引用的单元里除 mac-host-metrics 外全为 draft，
# 按不变量“引用到 draft 单元的模板不能 active”，所以目前没有一个模板可授权投产。

[[template]]
template_id = "macos-daily"
machine_class = "MacDaily"
capability_scope = ["collect_logs", "collect_metrics"]
unit_refs = [
  "mac-login-session",
  "mac-software-change",
  "mac-crash-panic",
  "mac-network-wifi",
  "mac-privacy-tcc",
  "mac-gatekeeper",
  "mac-launchd-service",
  "mac-reboot-power",
  "mac-misc-system",
  "mac-host-metrics",
]
catalog_version = 1
template_version = 1
required_privileges = ["root", "fda"]
status = "draft"
curated_by = "platform-maintenance"
curated_at = "2026-09-22T00:00:00Z"

[[template]]
