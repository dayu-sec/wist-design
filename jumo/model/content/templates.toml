# 常驻工作模板 —— 内容数据（对应模型 Control.Agent.Content.WorkTemplate）
#
# 模板 = **平台基线包 ⊕ 若干特性包**（组合，非继承）。模板只声明“选哪几块”，
# 不列单元、不内联 spec —— 公共集随基线包走、内容随目录走，避免两处漂移。
# 类别（machine_class）是**预设键**，不是继承的根；一台机器多属性时用「模板 + 单机提案」叠加包。
#
# 以下字段**不写**（由装载/展开时派生并校验，写死只会漂移）：
#   capability_scope   = 解析后单元能力的并集（collect_logs / collect_metrics）
#   required_privileges = **裁剪后**单元的 requires_privilege 并集（记进 SelectionBasis，非模板）
#
# 状态：4 个模板现在都是 draft —— 引用的单元里除 mac-host-metrics 外全为 draft，
# 按不变量“引用到 draft 单元的模板不能 active”，所以目前没有一个模板可授权投产。

[[template]]
template_id = "macos-daily"
machine_class = "MacDaily"
platform = "macos"
pack_refs = ["macos-base"]
catalog_version = 1
template_version = 1
status = "draft"
curated_by = "platform-maintenance"
curated_at = "2026-09-22T00:00:00Z"

# 开发机 = 日常机基线 + 开发包（不再用 base_template_id；公共集由 macos-base 承担）。
[[template]]
template_id = "macos-dev"
machine_class = "MacDev"
platform = "macos"
pack_refs = ["macos-base", "macos-dev"]
catalog_version = 1
template_version = 1
status = "draft"
curated_by = "platform-maintenance"
curated_at = "2026-09-22T00:00:00Z"

[[template]]
template_id = "linux-compute"
machine_class = "LinuxCompute"
platform = "linux"
pack_refs = ["linux-base", "linux-workload"]
catalog_version = 1
template_version = 1
status = "draft"
curated_by = "platform-maintenance"
curated_at = "2026-09-22T00:00:00Z"

# 数据机 = 公共基线 + 作业包 + 数据包 + 运维杂项包（**引用**，不再抄 linux-compute 的清单）。
[[template]]
template_id = "linux-data"
machine_class = "LinuxData"
platform = "linux"
pack_refs = ["linux-base", "linux-workload", "linux-datastore", "linux-ops-extra"]
catalog_version = 1
template_version = 1
status = "draft"
curated_by = "platform-maintenance"
curated_at = "2026-09-22T00:00:00Z"
