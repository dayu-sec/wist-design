# 采集目录 v1 —— 内容数据（对应模型 Control.Agent.Content.CollectionCatalog）
#
# 字段值写法约定（loader 尚未实现，此处先固定写法，便于评审）：
#   spec_fragment：
#     glob:...          文件路径 / 通配，可直接 tail
#     exporter:...      需周期导出器（二进制、DB、统一日志、审计链，不能直接 tail）
#     predicate:...     统一日志 predicate
#     interval:...      指标采集间隔
#   match：装了什么/跑了什么才采；空 = 平台基线必采
#   rule_ref：数据面 rule/oml 标识；空 = 规则未就绪（status 必然是 draft）
#   requires_privilege：none | root | fda
#   status：active（规则已就绪）| draft（面已定、规则未就绪）| deprecated

catalog_version = 1
origin = "Gateway"
published_at = "2026-09-22T00:00:00Z"

