[[units]]
unit_id = "mac-software-change"
family = "SoftwareChange"
capability = "collect_logs"
platform = "macos"
match = ""
# rule_ref 只声明「帧能落数据面」：本面由 agent_uplink/log_frame 承接（原文原样保留），
# 与 mac-host-metrics 同一口径。**正文归类尚未做**（记录带泛化的 log_type=agent.log）——
# 有意的中间态：先把真实样本采回来，再据样本决定要不要写正文规则。
rule_ref = "agent_uplink"
# install.log 实测是 `-rw-r--r-- root wheel`，非 root 也读得到（原标 root 与实况不符）。
requires_privilege = "none"
status = "active"

[[units.sources]]
kind = "FileGlob"
target = "/var/log/install.log"
# 实测：install.log 里约 28% 的行是缩进续行（一条 installer 事件后面跟 plist/TOML 详情块）。
# 不归并的话这些续行会被当成独立记录上送。
multiline = "indented"

[[units]]
unit_id = "mac-launchd-service"
family = "ServiceLifecycle"
capability = "collect_logs"
platform = "macos"
match = ""
rule_ref = "mac-drafts/launchd-service"
requires_privilege = "root"
# 可采：显式路径（不带星号）。轮转由采集器按 inode 跟，产物（`.0` / `.gz`）不会被当新对象采。
status = "active"

[[units.sources]]
kind = "FileGlob"
target = "/var/log/com.apple.xpc.launchd/launchd.log"

[[units]]
unit_id = "mac-crash-panic"
family = "CrashPanic"
capability = "collect_logs"
platform = "macos"
match = ""
rule_ref = "mac-drafts/crash-panic"
requires_privilege = "fda"
# 仍 draft：**事件型** —— 每个文件是一条独立事件（不是同一文件的历史），所以要通配展开，
# 而且要“运行中新发现的文件**从头上**”（glossary §9.12 `discovered_file_position`，未实现）。
# （另：实测本机 /Library/Logs/DiagnosticReports 下 0 个文件。）
status = "draft"

[[units.sources]]
kind = "FileGlob"
target = "/Library/Logs/DiagnosticReports/*.ips"

[[units.sources]]
kind = "FileGlob"
target = "/Library/Logs/DiagnosticReports/*.panic"

