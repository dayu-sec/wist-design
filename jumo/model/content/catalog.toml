# 采集目录 v1 —— 内容数据（对应模型 Control.Agent.Content.CollectionCatalog）
#
# 字段约定（loader 尚未实现，此处先固定**结构**，便于评审与校验）：
#   sources：采集来源列表（结构化的 kind + target，**替代原先自由文本的 spec_fragment**）：
#     kind = FileGlob            可直接 tail 的路径 / 通配
#            Exporter            需周期导出器（二进制、DB、统一日志、审计链、dmesg，不能直接 tail）
#            UnifiedLogPredicate 统一日志 predicate
#            MetricInterval      指标采集间隔
#     一个单元可有多来源；`glob:A|B` 这种在一个串里塞多路径的写法已拆成多条来源。
#   match：装了什么/跑了什么才采；空 = 平台基线必采（三态求值，见模型 CollectionUnit.match）
#   rule_ref：数据面 rule/oml 标识；空 = 规则未就绪（status 必然是 draft）
#   requires_privilege：none | root | fda
#   status：**规则就绪度** —— active（规则已就绪、能落数据面）| draft（面已定、规则未就绪）| deprecated

catalog_version = 1
origin = "Gateway"
published_at = "2026-09-22T00:00:00Z"

